# SearXNG bundled into Calivi — used only as the JSON API facade for search_service.
# No port is published (it is Calivi's internal search engine).
use_default_settings:
  engines:
    keep_only:
      - calivi-search

server:
  secret_key: "calivi-searxng-internal-key-change-if-public"
  limiter: false
  image_proxy: false

search:
  formats:
    - html
    - json
  autocomplete: ""
  default_lang: "auto"

engines:
  - name: calivi-search
    engine: json_engine
    shortcut: cs
    categories:
      - general
    enable_http: true
    timeout: 15
    search_url: "http://host.docker.internal:8787/search?q={query}"
    results_query: results
    title_query: title
    url_query: url
    content_query: snippet
